services:

  backend:
    build:
      context: ./server
    container_name: salekart-backend
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      args:
       VITE_API_URL: /api
    container_name: salekart-frontend

    ports:
      - "3000:80"
   
    depends_on:
      - backend

    restart: unless-stopped